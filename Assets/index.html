<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="container d-flex justify-content-between align-items-center py-3">
    <h3>Certo</h3>
    <button class="btn btn-primary">Sign in</button>
  </div>
</header>

<!-- HERO SECTION -->
<section class="hero">
  <div class="container">
    <div class="row align-items-center">

      <div class="col-md-6">
        <h1>Your mobile privacy is our mission</h1>
        <p>Protect your phone from spyware</p>
        <button class="btn btn-warning">Get iPhone</button>
        <button class="btn btn-dark">Get Android</button>
      </div>

      <div class="col-md-6">
        <img src="assets/images/phone.png" class="img-fluid" alt="phone">
      </div>

    </div>
  </div>
</section>

<!-- FEATURES SECTION -->
<section class="features">
  <div class="container text-center">
    <h2>Get your freedom back</h2>

    <div class="row mt-4">

      <div class="col-md-4">
        <div class="card p-3">
          <h5>Spyware detection</h5>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <h5>Keylogger detection</h5>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <h5>Threat removal</h5>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- INSIGHTS SECTION -->
<section class="insights">
  <div class="container text-center">
    <h2>Latest Insights</h2>

    <div class="row mt-4">

      <div class="col-md-4">
        <div class="card">
          <img src="assets/images/blog1.png" class="card-img-top" alt="">
          <div class="card-body">
            <h5>Signs Your Ex Is Spying</h5>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="assets/images/blog2.png" class="card-img-top" alt="">
          <div class="card-body">
            <h5>Remove Hacker</h5>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <img src="assets/images/blog3.png" class="card-img-top" alt="">
          <div class="card-body">
            <h5>Phone Surveillance</h5>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- CTA SECTION -->
<section class="cta text-center">
  <div class="container py-5">
    <h2>Is someone spying on your phone?</h2>
    <button class="btn btn-warning">Get iPhone</button>
    <button class="btn btn-dark">Get Android</button>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer text-center py-4">
  <p>© 2025 Certo</p>
</footer>

</body>
</html>
